[package]
name = "mem-test"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true

# for cargo-release
[package.metadata.release]
release = false

[features]
context-process-totals = ["delta_kernel_memory_tracking/process-totals"]
context-alloc-tracking = ["delta_kernel_default_engine/context-alloc-tracking"]
default = ["arrow"]
arrow = ["arrow-60"]
arrow-60 = ["delta_kernel/arrow-60"]
arrow-59 = ["delta_kernel/arrow-59"]

[dependencies]
delta_kernel = { path = "../kernel", features = ["default-engine-base"] }
delta_kernel_default_engine = { path = "../default-engine", features = ["rustls"] }
dhat = "0.3"
rayon = "1.10"
serde_json = "1"
tempfile = "3"
tracing = "0.1"
peak_alloc = "0.3.0"
delta_kernel_memory_tracking = { path = "../memory-tracking", default-features = false }
url = "2"

[[bin]]
name = "context-memory"
path = "src/bin/context-memory.rs"
required-features = ["context-alloc-tracking"]
